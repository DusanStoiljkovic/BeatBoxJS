<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitBox</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>BeatBoxJS</h1>
    <div class="drum-container">

  <button class="drum" data-key="E" style="top: 80px; left: -30px;">E</button>
  <button class="drum" data-key="R" style="top: 80px; left: 65px;">R</button>
  <button class="drum" data-key="F" style="top: 330px; left: 30px;">F</button>
  <button class="drum" data-key="G" style="top: 230px; left: 125px;">G</button>
  <button class="drum" data-key="H" style="top: 250px; left: 230px;">H</button>
  <button class="drum" data-key="J" style="top: 300px; left: 315px;">J</button>
  <button class="drum" data-key="V" style="top: 330px; left: 150px;">V</button>
  <button class="drum" data-key="B" style="top: 330px; left: 210px;">B</button>
  <button class="drum" data-key="I" style="top: 140px; left: 280px;">I</button>
  <button class="drum" data-key="K" style="top: 140px; left: 400px;">K</button>
</div>
    <img src="img/drum-kit.png" alt="Drum" class="drum-img">
    <img src="img/crash.png" alt="crash" class="crash-img">
    <img src="img/hihat-top.png" alt="hi-hat" class="hihat-img">
    
    <script src="script.js"></script>
</body>
</html>
